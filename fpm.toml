name = "ROTEX"
version = "0.2.3"
license = "MIT"
author = "Josh Forer"
maintainer = "jbf2177@columbia.edu"
copyright = "2025 Josh Forer"

[library]
source-dir = "src"

[build]
link = ["lapack"]
[preprocess]
[preprocess.cpp]
suffixes = [".f"]
macros = ["USE_FORBEAR", "USE_CDMSREADER", "USE_OPENMP"]
# macros = ["USE_FORBEAR", "USE_CDMSREADER", "USE_OPENMP", "PROB_SINGLE"]  # <- save S-matrix probabilities as singles

[dependencies]
forbear         = { git = "https://github.com/szaghi/forbear",                branch = "master" }
CDMSreader      = { git = "https://github.com/banana-bred/CDMSreader",        branch = "main" }
wignerd         = { git = "https://github.com/banana-bred/wignerd",           branch = "main" }
bspline-fortran = { git = "https://github.com/jacobwilliams/bspline-fortran", branch = "master" }
openmp = "*"

[dev-dependencies]
test-drive.git = "https://github.com/fortran-lang/test-drive"

[test]
name="tests"
source-dir="test"
main="tester.f"

[[executable]]
main="rotex.f"
source-dir="main"
name="rotex"

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"
